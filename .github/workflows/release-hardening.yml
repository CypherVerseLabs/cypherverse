name: Release hardening

on:
  push:
    branches:
      - release-hardening/2026-11-13
  pull_request:
    branches:
      - production-release/2026-11-13

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/cypherverse_ci
      JWT_SECRET: ci-only-placeholder-secret
      OPENAI_API_KEY: ci-only-placeholder-key
      R2_ENDPOINT: https://example.r2.cloudflarestorage.com
      R2_ACCESS_KEY_ID: ci-only-placeholder
      R2_SECRET_ACCESS_KEY: ci-only-placeholder
      R2_BUCKET_NAME: ci-only-placeholder
      R2_PUBLIC_URL: https://example.invalid
      NEXT_PUBLIC_API_URL: http://127.0.0.1:5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Commit regenerated root lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Refresh root npm lockfile"
            git push origin HEAD:release-hardening/2026-11-13
          fi
      - name: Export regenerated root lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-root-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Install backend dependencies
        run: npm install --prefix server --no-audit --no-fund
      - name: Build Next.js web application
        run: npm run build:web
      - name: Generate Prisma client
        run: npm --prefix server run prisma:generate
      - name: Validate Prisma schema
        run: npm --prefix server run prisma:validate
      - name: Build Express API
        run: npm run build:server
      - name: Run release-hardening tests
        run: npm run test:server
