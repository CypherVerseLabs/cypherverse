name: Release validation

on:
  push:
    branches:
      - security-hardening/nextjs-patched-release-2026-11-15
  pull_request:
    branches:
      - security-hardening/nextjs-patched-release-2026-11-15

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/cypherverse_ci
      JWT_SECRET: ci-only-placeholder-secret
      OPENAI_API_KEY: ci-only-placeholder-key
      R2_ENDPOINT: https://example.r2.cloudflarestorage.com
      R2_ACCESS_KEY_ID: ci-only-placeholder
      R2_SECRET_ACCESS_KEY: ci-only-placeholder
      R2_BUCKET_NAME: ci-only-placeholder
      R2_PUBLIC_URL: https://example.invalid
      NEXT_PUBLIC_API_URL: http://127.0.0.1:5000
      CORS_ORIGIN: http://127.0.0.1:3000
      ENABLE_TEST_PAYMENT_SIMULATION: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Upgrade Next.js to patched 15.5 release
        run: npm install next@15.5.29 --save-exact --legacy-peer-deps

      - name: Install web dependencies from lockfile
        run: npm ci --legacy-peer-deps

      - name: Install API dependencies from lockfile
        run: npm --prefix server ci

      - name: Audit web dependencies
        run: npm audit --json > root-audit.json || true

      - name: Audit API dependencies
        run: npm --prefix server audit --json > server-audit.json || true

      - name: Print dependency audit summary
        run: |
          node -e 'for (const file of ["root-audit.json", "server-audit.json"]) { const a = require("./" + file); console.log("\\n" + file, a.metadata?.vulnerabilities); for (const [name, v] of Object.entries(a.vulnerabilities || {})) console.log(name, v.severity, "range=" + v.range, "fix=" + JSON.stringify(v.fixAvailable)); }'

      - name: Upload dependency audit reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-reports
          path: |
            root-audit.json
            server-audit.json
          if-no-files-found: error

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Run server unit tests
        run: npm run test:server

      - name: Build Next.js web application
        run: npm run build:web

      - name: Build Express API
        run: npm run build:server

      - name: Commit tested Next.js dependency update
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Patch Next.js image optimizer security vulnerabilities"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
